<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OBS Overlay Maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="eyebrow">OBS TOOL</p>
        <h1>Overlay Maker</h1>
        <p class="muted">1920×1080 の配信オーバーレイをブラウザ上で組み立てます。</p>
      </div>

      <div class="tool-group">
        <button id="addPanelBtn" type="button">＋ パネル追加</button>
        <button id="addTextBtn" type="button">＋ 文字追加</button>
        <button id="addShapeBtn" type="button">＋ 図形追加</button>
        <button type="button" disabled>＋ 時計追加</button>
      </div>

      <section class="panel-controls" aria-labelledby="panelControlsTitle">
        <div>
          <p class="eyebrow">PANEL</p>
          <h2 id="panelControlsTitle">パネル編集</h2>
        </div>
        <p id="panelSelectionMessage" class="image-name">編集するパネルを選択してください</p>
        <div class="color-row">
          <label for="panelBorderColor">枠色<input id="panelBorderColor" type="color" value="#65e6ff" disabled></label>
          <label for="panelBackgroundColor">背景色<input id="panelBackgroundColor" type="color" value="#142a42" disabled></label>
        </div>
        <label class="opacity-control" for="panelBorderOpacity">
          <span>枠の透明度</span>
          <output id="panelBorderOpacityValue" for="panelBorderOpacity">100%</output>
        </label>
        <input id="panelBorderOpacity" type="range" min="0" max="100" value="100" disabled>
        <label class="opacity-control" for="panelBackgroundOpacity">
          <span>背景の透明度</span>
          <output id="panelBackgroundOpacityValue" for="panelBackgroundOpacity">90%</output>
        </label>
        <input id="panelBackgroundOpacity" type="range" min="0" max="100" value="90" disabled>
        <label for="panelBorderStyle">枠の形</label>
        <select id="panelBorderStyle" disabled>
          <option value="solid">実線</option>
          <option value="dotted">点線</option>
          <option value="double">二重線</option>
          <option value="dashed">破線</option>
        </select>
        <fieldset class="corner-controls">
          <legend>斜めにする箇所</legend>
          <label><input id="panelCornerTopLeft" type="checkbox" checked disabled>左上</label>
          <label><input id="panelCornerTopRight" type="checkbox" checked disabled>右上</label>
          <label><input id="panelCornerBottomLeft" type="checkbox" checked disabled>左下</label>
          <label><input id="panelCornerBottomRight" type="checkbox" checked disabled>右下</label>
        </fieldset>
        <div class="size-row">
          <label for="panelWidth">幅<input id="panelWidth" type="number" min="80" max="1920" step="10" disabled></label>
          <label for="panelHeight">高さ<input id="panelHeight" type="number" min="50" max="1080" step="10" disabled></label>
        </div>
        <button id="deletePanelBtn" class="danger-button" type="button" disabled>選択中のパネルを削除</button>
      </section>

      <section class="text-controls" aria-labelledby="textControlsTitle">
        <div>
          <p class="eyebrow">TEXT</p>
          <h2 id="textControlsTitle">文字編集</h2>
        </div>
        <p id="textSelectionMessage" class="image-name">編集する文字を選択してください</p>
        <label for="textContent">内容</label>
        <textarea id="textContent" rows="3" disabled></textarea>
        <label for="textFontFamily">フォント</label>
        <select id="textFontFamily" disabled>
          <option value="system-ui">システム標準</option>
          <option value="'Yu Gothic', 'YuGothic', sans-serif">游ゴシック</option>
          <option value="Meiryo, sans-serif">メイリオ</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Impact, sans-serif">Impact</option>
          <option value="monospace">等幅フォント</option>
        </select>
        <div class="size-row">
          <label for="textFontSize">文字サイズ<input id="textFontSize" type="number" min="8" max="300" step="1" disabled></label>
          <label for="textColor">文字色<input id="textColor" type="color" value="#ffffff" disabled></label>
        </div>
        <label class="opacity-control" for="textOpacity">
          <span>文字の透明度</span>
          <output id="textOpacityValue" for="textOpacity">100%</output>
        </label>
        <input id="textOpacity" type="range" min="0" max="100" value="100" disabled>
        <div class="text-option-row">
          <label><input id="textBold" type="checkbox" disabled>太字</label>
          <label for="textAlign">配置
            <select id="textAlign" disabled><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select>
          </label>
        </div>
      </section>

      <section class="shape-controls" aria-labelledby="shapeControlsTitle">
        <div><p class="eyebrow">SHAPE</p><h2 id="shapeControlsTitle">図形編集</h2></div>
        <p id="shapeSelectionMessage" class="image-name">編集する図形を選択してください</p>
        <label for="shapeType">図形</label>
        <select id="shapeType" disabled><option value="star">星</option><option value="heart">ハート</option><option value="diamond">ひし形</option><option value="circle">円</option><option value="triangle">三角形</option></select>
        <div class="size-row">
          <label for="shapeColor">色<input id="shapeColor" type="color" value="#ff5d8f" disabled></label>
          <label for="shapeRotation">回転<input id="shapeRotation" type="number" min="-360" max="360" step="1" disabled></label>
        </div>
        <label class="opacity-control" for="shapeOpacity"><span>透明度</span><output id="shapeOpacityValue" for="shapeOpacity">100%</output></label>
        <input id="shapeOpacity" type="range" min="0" max="100" value="100" disabled>
        <div class="size-row">
          <label for="shapeWidth">幅<input id="shapeWidth" type="number" min="20" max="1920" step="10" disabled></label>
          <label for="shapeHeight">高さ<input id="shapeHeight" type="number" min="20" max="1080" step="10" disabled></label>
        </div>
        <button id="deleteShapeBtn" class="danger-button" type="button" disabled>選択中の図形を削除</button>
      </section>

      <section class="history-controls" aria-label="編集操作">
        <div class="button-row">
          <button id="undoBtn" class="secondary-button" type="button" disabled>元に戻す</button>
          <button id="redoBtn" class="secondary-button" type="button" disabled>やり直す</button>
        </div>
        <div class="button-row">
          <button id="saveBtn" class="secondary-button" type="button">ブラウザに保存</button>
          <button id="loadBtn" class="secondary-button" type="button">保存を読込</button>
        </div>
        <button id="exportBtn" type="button">OBS用HTMLを書き出す</button>
        <p id="editorMessage" class="control-message" role="status"></p>
      </section>

      <section class="reference-controls" aria-labelledby="referenceTitle">
        <div>
          <p class="eyebrow">REFERENCE</p>
          <h2 id="referenceTitle">ゲーム画面</h2>
        </div>
        <label class="file-picker" for="gameImageInput">スクショを選択</label>
        <input id="gameImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
        <p id="gameImageName" class="image-name">画像は選択されていません</p>
        <label class="opacity-control" for="gameImageOpacity">
          <span>表示透明度</span>
          <output id="gameImageOpacityValue" for="gameImageOpacity">35%</output>
        </label>
        <input id="gameImageOpacity" type="range" min="0" max="100" value="35" />
        <button id="removeGameImageBtn" class="secondary-button" type="button" disabled>画像を外す</button>
        <p id="gameImageMessage" class="control-message" role="status"></p>
        <small class="muted">レイアウト確認専用です。オーバーレイには含まれません。</small>
      </section>

      <div class="status-card">
        <span>現在の段階</span>
        <strong>MVP Editor</strong>
        <small>編集・保存・OBS用HTML出力</small>
      </div>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">PREVIEW</p>
          <h2>1920 × 1080</h2>
        </div>
        <div class="legend">透明部分はOBS上でゲーム画面になります</div>
      </header>

      <section class="canvas-wrap">
        <div id="overlayCanvas" class="overlay-canvas" aria-label="OBS overlay canvas">
          <img id="gameReferenceImage" class="game-reference-image" alt="ゲーム画面の参照画像" hidden />
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
